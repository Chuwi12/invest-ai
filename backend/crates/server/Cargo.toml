[package]
name = "server"
edition.workspace = true
version.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "server"
path = "src/lib.rs"

[[bin]]
name = "invest-ai"
path = "src/main.rs"

# Prueba de humo de una instancia en marcha (`./invest-ai selftest`).
[[bin]]
name = "invest-ai-selftest"
path = "src/bin/selftest.rs"

[dependencies]
domain.workspace = true
market.workspace = true
ai.workspace = true
anyhow.workspace = true
async-trait.workspace = true
chrono.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
tracing.workspace = true
uuid.workspace = true

axum = { version = "0.8", features = ["ws", "macros"] }
tower-http = { version = "0.6", features = ["compression-br", "compression-gzip", "cors", "trace", "fs"] }
# `macros` es necesario para `sqlx::migrate!`; sin TLS ni `any`, que no se usan.
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros", "chrono"] }
dotenvy = "0.15"
tokio-util = { version = "0.7", features = ["rt"] }
tokio-tungstenite = "0.26"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
sha2 = "0.10"
base64 = "0.22"
